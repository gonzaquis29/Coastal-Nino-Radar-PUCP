[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radar"
version = "0.2.0"
description = "Radar Niño Costero: lo que se dice frente a lo que dice el ENFEN (INF656 PUCP)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "lxml>=5.0",
    "pymupdf>=1.24",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# NLP: instrumentos de validación con spaCy (modelo: python -m spacy download es_core_news_sm)
nlp = ["spacy>=3.8", "pysentimiento>=0.7.3", "onnxruntime>=1.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM108"]
